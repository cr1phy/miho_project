name: CI

on:
  push:
    branches: [development, master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: C++ / ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc
            cxx: g++
            c_flags: -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
            cxx_flags: -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
            sanitizers: true
          - os: ubuntu-24.04
            compiler: clang
            cc: clang
            cxx: clang++
            c_flags: -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
            cxx_flags: -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
            sanitizers: true
          - os: macos-latest
            compiler: appleclang
            cc: clang
            cxx: clang++
            c_flags: -Wall -Wextra -Wpedantic -Werror
            cxx_flags: -Wall -Wextra -Wpedantic -Werror
            sanitizers: false
          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl
            c_flags: /W4 /WX
            cxx_flags: /W4 /WX
            sanitizers: false
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure (Unix-like)
        if: runner.os != 'Windows'
        run: >-
          cmake -S core -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_C_FLAGS="${{ matrix.c_flags }}"
          -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"
      - name: Configure (MSVC)
        if: runner.os == 'Windows'
        run: >-
          cmake -S core -B build -DBUILD_TESTING=ON
          -DCMAKE_C_FLAGS="${{ matrix.c_flags }}"
          -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"
      - name: Build (Unix-like)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel 2
      - name: Build (MSVC)
        if: runner.os == 'Windows'
        run: cmake --build build --config Debug --parallel 2
      - name: Test lexer, parser and C ABI (with sanitizers)
        if: matrix.sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Test lexer, parser and C ABI
        if: ${{ !matrix.sanitizers && runner.os != 'Windows' }}
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Test lexer, parser and C ABI (MSVC)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Debug --output-on-failure --no-tests=error
      - name: Upload core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.os }}-${{ matrix.compiler }}
          if-no-files-found: error
          path: |
            build/**/libmiho_project.a
            build/**/libmiho_project.so
            build/**/libmiho_project.dylib
            build/**/miho_project.lib
            build/**/lexer_test*
            build/**/parser_test*
            build/**/ffi_test*

  app:
    name: Tauri app / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_path: app/src-tauri/target/debug/logiclab-app
            run_lints: true
          - os: macos-latest
            artifact_path: app/src-tauri/target/debug/logiclab-app
            run_lints: false
          - os: windows-latest
            artifact_path: app/src-tauri/target/debug/logiclab-app.exe
            run_lints: false
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: oven-sh/setup-bun@v2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-rust-1.96.0-${{ hashFiles('app/src-tauri/Cargo.lock', 'app/src-tauri/build.rs', 'core/*.cpp', 'core/*.hpp', 'core/*.h') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.96.0-
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Lint frontend
        if: matrix.run_lints
        run: bun run lint
      - name: Test editor logic
        run: bun test
      # The Tauri crate embeds app/dist, so the frontend is built before any cargo step.
      - name: Type-check and build frontend
        run: bun run build
      - name: Check formatting
        if: matrix.run_lints
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy
        if: matrix.run_lints
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust wrapper and C++ FFI
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build desktop executable
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml
      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          if-no-files-found: error
          path: ${{ matrix.artifact_path }}
